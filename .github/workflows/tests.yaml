name: run tests
on: [push, pull_request]
jobs:
  collect-tests:
    name: Collect tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.15"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          pip install \
            pytest \
            pytest-asyncio \
            pytest-httpbin \
            pytest-rerunfailures

      - name: Install package
        run: pip install -e .

      - name: Run pytest collection
        run: pytest --collect-only -q


  setup-cache:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
        # zstandard doesn't support 3.14 -> httpx doesn't support zstd -> don't cache zstd responses
        - "3.15"
        deps:
        - httpx[http2]>=0.14.0
        exclude: []
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Setup Cache
      uses: actions/cache@v4
      env:
        cache-name: cache-pip
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-${{ env.cache-name }}-${{ matrix.deps }}-${{ hashFiles('pyproject.toml', 'setup.cfg') }}
        restore-keys: |
          ${{ runner.os }}-${{ env.cache-name }}-${{ matrix.deps }}-
          ${{ runner.os }}-${{ env.cache-name }}-

    - name: Install pygit2 deps
      run: |
        sudo apt update
        sudo apt install -y libgit2-dev

    - name: Install pacman/libalpm deps
      run: |
        sudo apt install -y pacman-package-manager libarchive-tools libalpm-dev libssl-dev libarchive-dev libcurl4-openssl-dev libseccomp-dev libgpgme-dev
    - name: Configure Arch repos
      run: |
        sudo pacman-key --init
        sudo pacman-key --populate archlinux 2>/dev/null || true
        cat <<'EOF' | sudo tee -a /etc/pacman.conf
        [core]
        Server = https://geo.mirror.pkgbuild.com/core/os/x86_64
        [extra]
        Server = https://geo.mirror.pkgbuild.com/extra/os/x86_64
        EOF
        sudo pacman -Sy
    - name: Install pyalpm
      run: |
        pip install -U pyalpm

    - name: Install pycurl deps
      if: ${{ contains(matrix.deps, 'pycurl') }}
      run: |
        sudo apt install -y libcurl4-openssl-dev

    - name: Install lxml deps
      if: ${{ contains(matrix.python-version, '3.15') }}
      run: |
        sudo apt install -y libxml2-dev libxslt1-dev cython3

    - name: Install Python deps
      env:
        # use env to avoid `>` being redirection
        deps: ${{ matrix.deps }}
      run: pip install -U $deps pytest 'pytest-asyncio>=0.24' pytest-httpbin pytest-rerunfailures structlog tomli platformdirs lxml jq werkzeug awesomeversion dulwich
    # don't use binary distribution because:
    #   hardcoded cacert path doesn't work on Ubuntu (should have been resolved?)
    #   limited compression support (only deflate & gzip)
    - name: Install pycurl
      if: ${{ contains(matrix.deps, 'pycurl') }}
      run: |
        pip uninstall -y pycurl
        pip install -U pycurl --no-binary :all:
    - name: Install zstandard
      if: ${{ !contains(matrix.python-version, '3.14') && !contains(matrix.python-version, '3.15') }}
      run: |
        pip install -U zstandard
    - name: Install pygit2
      if: ${{ !contains(matrix.python-version, '3.15') }}
      run: |
        pip install -U pygit2

    - name: Decrypt keys
      env:
        KEY: ${{ secrets.KEY }}
      run: if [[ -n $KEY ]]; then openssl enc -d -aes-256-ctr -pbkdf2 -k $KEY -in keyfile.toml.enc -out keyfile.toml; fi

    - name: Setup mitmproxy cache
      uses: actions/cache@v4
      env:
        cache-name: cache-mitm
      with:
        path: ~/.mitmproxy
        key: ${{ env.cache-name }}
        restore-keys: |
          ${{ env.cache-name }}-
    - name: Install mitmproxy
      run: |
        /usr/bin/python -m venv --system-site-packages ~/.mitmproxy/venv
        . ~/.mitmproxy/venv/bin/activate
        pip install -U mitmproxy
        # https://github.com/DevToys-app/DevToys/issues/1373#issuecomment-2599820594
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    - name: Run pytest
      env:
        mitmdump: /home/runner/.mitmproxy/venv/bin/mitmdump
      run: scripts/run_cached_tests

    - name: show mitmproxy log
      if: ${{ always() }}
      run: cat mitmdump_output

